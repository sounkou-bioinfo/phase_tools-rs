name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test --all-targets

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Exercise registry and HBA certificate
        shell: bash
        run: |
          target/release/phase-tools targets --assay wes --validated-enrichment
          target/release/phase-tools hba \
            --assay wgs \
            --evidence examples/hba/evidence.synthetic.tsv \
            --hypotheses examples/hba/hypotheses.synthetic.tsv \
            --min-margin 10 \
            --certificate "${RUNNER_TEMP}/hba.cert"
          target/release/phase-tools verify --certificate "${RUNNER_TEMP}/hba.cert"

  lean:
    name: Lean certificate proofs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
