name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-once:
    name: Apply rustfmt once
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and commit
        shell: bash
        run: |
          cargo fmt
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Apply rustfmt"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  rust:
    name: Rust (${{ matrix.os }})
    needs: format-once
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test --all-targets

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Exercise registry and HBA certificate
        shell: bash
        run: |
          target/release/phase-tools targets --assay wes --validated-enrichment
          target/release/phase-tools hba \
            --assay wgs \
            --evidence examples/hba/evidence.synthetic.tsv \
            --hypotheses examples/hba/hypotheses.synthetic.tsv \
            --min-margin 10 \
            --certificate "${RUNNER_TEMP}/hba.cert"
          target/release/phase-tools verify --certificate "${RUNNER_TEMP}/hba.cert"

  lean:
    name: Lean certificate proofs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
