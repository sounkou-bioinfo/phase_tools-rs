[package]
name = "phase_tools-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Proof-carrying short-read callers for difficult genomic loci"
repository = "https://github.com/sounkou-bioinfo/phase_tools-rs"
homepage = "https://github.com/sounkou-bioinfo/phase_tools-rs"
documentation = "https://github.com/sounkou-bioinfo/phase_tools-rs#readme"
readme = "README.md"
build = false
autobins = false

[lib]
name = "phase_tools"
path = "src/lib.rs"

[[bin]]
name = "phase-tools"
path = "src/bin/phase_tools.rs"

[dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
